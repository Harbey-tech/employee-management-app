{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "employee-management.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "employee-management.name" . }}-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "employee-management.name" . }}-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "employee-management.fullname" . }}
  labels:
    {{- include "employee-management.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "employee-management.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

  egress:
    - {}
{{- end }}

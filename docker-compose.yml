services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: employee_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-management-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: employee_db
      DB_USER: employee_app
      DB_PASSWORD: employee_dev_password
      JWT_SECRET: change_this_to_a_long_random_secret
    ports:
      - "3000:3000"

volumes:
  postgres_data:
